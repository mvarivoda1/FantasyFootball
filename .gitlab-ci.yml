stages:
  - build
  - test
  - e2e

build-web:
  stage: build
  script:
    - docker compose build web
  tags:
    - ubuntu
    - docker

build-api:
  stage: build
  script:
    - docker compose build api
  tags:
    - ubuntu
    - docker

integration-tests:
  stage: test
  needs: []
  cache:
    key: nuget
    paths:
      - .nuget/packages
  script:
    - docker run --rm
      --user "$(id -u):$(id -g)"
      -e HOME=/tmp -e DOTNET_NOLOGO=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1
      -e NUGET_PACKAGES=/src/.nuget/packages
      -v "$CI_PROJECT_DIR:/src" -w /src
      mcr.microsoft.com/dotnet/sdk:9.0
      dotnet test FantasyFootball.Tests/FantasyFootball.Tests.csproj
      -c Release
      --logger "junit;LogFilePath=/src/TestResults/junit.xml"
  artifacts:
    when: always
    reports:
      junit: TestResults/junit.xml
  tags:
    - ubuntu
    - docker

e2e-tests:
  stage: e2e
  resource_group: e2e-stack
  script:
    - docker rm -f ff-e2e-run 2>/dev/null || true
    - docker compose up -d --build --wait --wait-timeout 300 db api web proxy
    - docker compose --profile e2e build e2e
    - docker compose --profile e2e run --name ff-e2e-run e2e
  after_script:
    - docker cp "ff-e2e-run:/e2e/playwright-report" ./playwright-report || true
    - docker rm -f ff-e2e-run || true
    - docker compose logs --no-color --tail 200 > compose-logs.txt || true
    - docker compose --profile e2e down -v --remove-orphans || true
  artifacts:
    when: always
    paths:
      - playwright-report/
      - compose-logs.txt
    expire_in: 1 week
  tags:
    - ubuntu
    - docker
