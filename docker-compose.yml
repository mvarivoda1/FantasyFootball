services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ff_database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ffPass123!"
    ports:
      - 1433:1433
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"ffPass123!\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Web aplikacija (build iz Dockerfile-a). Za lokalni smoke-test cijelog stacka:
  #   docker compose up --build
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ff_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__FantasyFootballDbContext: "Data Source=db,1433;Initial Catalog=FantasyFootball_;User ID=sa;Password=ffPass123!;MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=True;"
    ports:
      - 8080:8080
    restart: unless-stopped

volumes:
  sqldata: